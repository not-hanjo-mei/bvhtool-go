name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe, name: bvhtool-go-windows-amd64 }
          - { goos: linux,   goarch: amd64, ext: '',   name: bvhtool-go-linux-amd64 }
          - { goos: linux,   goarch: arm64, ext: '',   name: bvhtool-go-linux-arm64 }
          - { goos: darwin,  goarch: amd64, ext: '',   name: bvhtool-go-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, ext: '',   name: bvhtool-go-darwin-arm64 }
          - { goos: android, goarch: arm64, ext: '',   name: bvhtool-go-android-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o ${{ matrix.name }}${{ matrix.ext }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*
